# Dependabot configuration — Massage Tulum
# Strategy: weekly scans, max 5 open PRs, grouped by dep type.
# See ADR-0005 for rationale (weekly vs daily, 5-PR cap, no Snyk in v1).
version: 2
updates:
  - package-ecosystem: "npm"
    # "/" scans the workspace root. Dependabot resolves pnpm workspaces
    # from the root package.json and pnpm-lock.yaml automatically.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Cap at 5 concurrent PRs to prevent queue flooding (ADR-0005).
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
    # Defer TypeScript major bumps until we choose to migrate.
    # TS 6 has real breaking changes in this repo (Jest globals,
    # moduleResolution=node10 deprecation, CSS module declarations).
    # Reopen by removing this entry when we are ready to do the migration
    # work. See closed PR #38 for the diagnosis.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    # Group only minor + patch updates per dep-type — reduces noise without
    # bundling breaking changes. Major bumps land as individual PRs so each
    # can be evaluated on its own merits (#28 reverted because TS 6 + ESLint
    # 10 + Vitest 4 + Jest 30 + Tailwind 4 + Next-eslint-config 16 broke main
    # together; #27 closed for the same reason on the prod side with Next 16
    # + Zod 4 + lucide-react 1).
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
