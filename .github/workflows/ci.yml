name: ci

on:
  # CI runs on every PR push (pull_request event) and on direct pushes to
  # `main` only (post-merge sanity check). Earlier this ran on push to every
  # branch, which duplicated every PR's CI (push + pull_request both fired).
  # That ate the free GitHub Actions quota fast. See ADR-0004 + cost
  # discipline section of CLAUDE.md.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions for all jobs. Explicitly granted because
# GitHub's default token has limited write scopes on pull_request events,
# and gitleaks-action@v2 calls the GitHub API to list PR commits — without
# pull-requests:read it errors with HTTP 403:
#   'Resource not accessible by integration' on
#   GET /repos/.../pulls/<n>/commits
# Keep this minimal. Broaden per-job (e.g., `id-token: write` for OIDC
# deploys) only when a specific job needs it.
permissions:
  contents: read
  pull-requests: read

# ---------------------------------------------------------------------------
# Re-usable pnpm + Node setup steps are duplicated per job intentionally.
# Each job is independently cacheable; sharing via artifacts adds complexity
# and a serial bottleneck that hurts warm-run targets. See ADR-0004.
# ---------------------------------------------------------------------------

jobs:

  # --------------------------------------------------------------------------
  # Job 1: Lint + Typecheck
  # Required status check: ci/lint-and-typecheck
  # --------------------------------------------------------------------------
  lint-and-typecheck:
    name: ci/lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          # NOTE: do NOT set cache: 'pnpm' here — conflicts with pnpm/action-setup.
          # Cache is managed by actions/cache below. See ADR-0004 §caching.

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck (Turborepo)
        run: pnpm turbo lint typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # --------------------------------------------------------------------------
  # Job 2: Unit tests
  # Required status check: ci/test
  # --------------------------------------------------------------------------
  test:
    name: ci/test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (Turborepo)
        run: pnpm turbo test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          NODE_ENV: test

  # --------------------------------------------------------------------------
  # Job 3: Build (both apps via Turborepo)
  # Required status check: ci/build
  # --------------------------------------------------------------------------
  build:
    name: ci/build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Turborepo)
        run: pnpm turbo build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # --------------------------------------------------------------------------
  # Job 4: RLS policy tests via Supabase local stack + pgTAP
  # Required status check: ci/rls-test
  #
  # Runs independently of lint/test/build — Supabase Docker start adds ~45s
  # cold, so parallelism avoids putting this on the critical path.
  #
  # Will fail until the Supabase scaffold PR (CU-869d29mzx) merges and
  # supabase/tests/rls_baseline_test.sql exists. Expected — see PR description.
  # --------------------------------------------------------------------------
  rls-test:
    name: ci/rls-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations and seed
        # supabase db reset applies all migrations in supabase/migrations/ then seeds.
        # pgTAP is bundled with the Supabase Docker stack — no additional install needed.
        run: supabase db reset

      - name: Run RLS tests (pgTAP)
        # Runs all *.sql files in supabase/tests/ via pgTAP.
        # rls_baseline_test.sql (ADR-0003 Convention 2) must exist and assert
        # that zero public tables have rowsecurity = false.
        run: supabase test db

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  # --------------------------------------------------------------------------
  # Job 5: Secret scanning via gitleaks
  # Required status check: ci/gitleaks
  #
  # Defense-in-depth alongside GitHub's native Secret Scanning + Push
  # Protection (configured at the repo level — always-on, not a CI job).
  # See ADR-0004 and ADR-0005.
  # --------------------------------------------------------------------------
  gitleaks:
    name: ci/gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Job 6: Production dependency audit
  # Required status check: ci/pnpm-audit
  #
  # Failure policy (ADR-0005):
  #   HIGH + CRITICAL CVEs in --prod deps  → CI fails (hard gate)
  #   HIGH + CRITICAL CVEs in dev-only deps → NOT gated here (dev surface only)
  #   MODERATE + LOW CVEs anywhere          → not gated (signal-to-noise too low)
  #
  # Will fail until pnpm-lock.yaml exists (CU-869d29n05 scaffolding PR).
  # Expected — see PR description.
  #
  # Override procedure for accepted CVEs with no available fix:
  #   1. Document in the ClickUp ticket: CVE ID, package, reason, review-by date.
  #   2. Add to .pnpmauditignore (or --ignore flag — verify pnpm 10.x syntax).
  #   3. Comment in .pnpmauditignore with the CVE ID and review-by date.
  # --------------------------------------------------------------------------
  pnpm-audit:
    name: ci/pnpm-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (HIGH+ only)
        # --prod: excludes devDependencies from hard failures (ADR-0005).
        # Dev-only CVEs (TypeScript, ESLint, etc.) do not affect the deployed
        # application's attack surface and are excluded from this gate.
        run: pnpm audit --audit-level=high --prod
