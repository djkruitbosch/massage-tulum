name: Supabase keep-alive

# Keeps the dev (and future uat) Supabase free-tier project awake by pinging
# the REST API every 3 days. Also prevents GitHub from auto-disabling scheduled
# workflows after 60 days of repo inactivity via the keepalive-workflow action.
#
# See ADR-0002 §Free-tier pause mitigation for rationale.
# Required secrets (repository-level Actions secrets):
#   SUPABASE_URL      — e.g. https://xyzxyz.supabase.co
#   SUPABASE_ANON_KEY — project anon/public key (safe to use in ping scripts)

on:
  schedule:
    - cron: '0 8 */3 * *'   # 08:00 UTC every 3rd day — well within 7-day pause window
  workflow_dispatch:          # Manual trigger for testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions. The keepalive job writes a commit so it needs
# contents: write. The ping job only reads; it inherits the same permission
# and that is fine (over-permissioned for ping, acceptable given same workflow).
permissions:
  contents: write

jobs:

  # --------------------------------------------------------------------------
  # Job: ping
  # Pings the Supabase GoTrue settings endpoint with the anon key to reset the
  # inactivity timer. /auth/v1/settings is a public endpoint that accepts the
  # anon/publishable key and returns 200 when the project is active. (We
  # cannot use /rest/v1/ — that root path requires service_role on current
  # Supabase projects.) Any non-200 response means the project is paused, the
  # key is invalid, or the URL is wrong.
  # --------------------------------------------------------------------------
  ping:
    name: keep-alive/ping
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase auth settings
        # Do NOT add `set -x` or echo the secret values — they must not appear
        # in logs. The status code (numeric only) is safe to print.
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/settings")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected HTTP status $STATUS — project may be paused, key may be invalid, or URL may be wrong"
            exit 1
          fi
          echo "Ping OK — Supabase project is active"

  # --------------------------------------------------------------------------
  # Job: keepalive
  # Prevents GitHub from auto-disabling this scheduled workflow after 60 days
  # of repo inactivity (GitHub's scheduled-workflow disable policy).
  # Uses gautamkrishnar/keepalive-workflow@v2 with time_elapsed: 50 so it acts
  # before the 60-day cutoff.
  # --------------------------------------------------------------------------
  keepalive:
    name: keep-alive/keepalive-workflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: 50
